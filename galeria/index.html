<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeria · Direcional Vendas CPS</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1630;--panel:#12224a;--line:#22376b;--ink:#eef2fb;--muted:#93a3c8;--accent:#ffb627;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
body{background:radial-gradient(1100px 480px at 50% -10%, rgba(255,182,39,.10), transparent 60%),var(--bg);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
.back{color:var(--muted);font-size:13px;text-decoration:none}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,42px);letter-spacing:.02em;margin:4px 0 6px;text-transform:uppercase}
.sub{color:var(--muted);font-size:14px;margin:0 0 22px}
.filtros{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.filtros button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 16px;font:600 14px var(--body);cursor:pointer}
.filtros button.on{background:var(--accent);color:#1a1300;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:3/4;background:#0e1b3a;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.thumb img,.thumb video{width:100%;height:100%;object-fit:contain}
#zoom video{max-width:94vw;max-height:94vh;border-radius:14px;display:none}
.info{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.nome{font-weight:700}
.meta{color:var(--muted);font-size:13px}
.acoes{display:flex;gap:8px}
.acoes a{flex:1;text-align:center;text-decoration:none;border-radius:10px;padding:8px 0;font-weight:700;font-size:14px}
.abrir{background:#1d3366;color:var(--ink)}
.baixar{background:var(--accent);color:#1a1300}
.linkbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink);text-decoration:none;width:100%;height:100%;background:linear-gradient(160deg,#1d3366,#0e1b3a)}
.linkbox svg{width:72px;height:72px}
.linkbox span{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;text-align:center;padding:0 14px}
.vazio{color:var(--muted)}
#zoom{position:fixed;inset:0;background:rgba(5,10,25,.92);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#zoom img{max-width:94vw;max-height:94vh;border-radius:14px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← Direcional Vendas CPS</a>
  <div class="eyebrow">Direcional Vendas · Campinas</div>
  <h1>Galeria · Fotos, GIFs e vídeos</h1>
  <p class="sub">Imagens, GIFs e vídeos do time guardados no site. Toque para ver em tela cheia ou baixe para usar no WhatsApp e nos status.</p>
  <div class="filtros" id="filtros">
    <button data-f="todos" class="on">Todos</button>
    <button data-f="gif">GIFs</button>
    <button data-f="foto">Fotos</button>
    <button data-f="video">Vídeos</button>
    <button data-f="link">Links</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div id="zoom"><img alt=""><video controls playsinline></video></div>
<script src="midia.js?v=6"></script>
<script>
const grid = document.getElementById("grid"), zoom = document.getElementById("zoom");
let filtro = "todos";
function dataBR(d){ return d.slice(8,10) + "/" + d.slice(5,7) + "/" + d.slice(0,4); }
function render(){
  const itens = MIDIA.filter(m => filtro === "todos" || m.tipo === filtro);
  grid.innerHTML = itens.length ? "" : '<p class="vazio">Nada aqui ainda.</p>';
  for (const m of itens){
    if (m.tipo === "link") {
      const c = document.createElement("div"); c.className = "card";
      c.innerHTML = `<a class="thumb linkbox" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="#ffb627" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg><span></span></a>
        <div class="info"><div class="nome"></div><div class="meta"></div>
        <div class="acoes"><a class="baixar" target="_blank" rel="noopener">Abrir link</a></div></div>`;
      c.querySelector(".linkbox").href = m.arquivo; c.querySelector(".linkbox span").textContent = m.nome;
      c.querySelector(".nome").textContent = m.nome;
      c.querySelector(".meta").textContent = "Link · " + dataBR(m.data);
      c.querySelector(".baixar").href = m.arquivo;
      grid.appendChild(c); continue;
    }
    const nomeArq = m.arquivo.split("/").pop();
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `<div class="thumb">${m.tipo === "video" ? '<video muted loop playsinline preload="metadata"></video>' : '<img loading="lazy" alt="">'}</div>
      <div class="info"><div class="nome"></div><div class="meta"></div>
      <div class="acoes"><a class="abrir" target="_blank" rel="noopener">Abrir</a><a class="baixar">Baixar</a></div></div>`;
    const mid = c.querySelector(".thumb").firstElementChild; mid.src = m.arquivo + (m.tipo === "video" ? "#t=0.5" : "");
    if (m.tipo === "video") { mid.addEventListener("mouseenter", () => mid.play()); mid.addEventListener("mouseleave", () => mid.pause()); }
    c.querySelector(".nome").textContent = m.nome;
    c.querySelector(".meta").textContent = ({gif: "GIF", foto: "Foto", video: "Vídeo"}[m.tipo]) + " · " + dataBR(m.data);
    c.querySelector(".abrir").href = m.arquivo;
    const b = c.querySelector(".baixar"); b.href = m.arquivo; b.setAttribute("download", nomeArq);
    c.querySelector(".thumb").addEventListener("click", () => abrirZoom(m));
    grid.appendChild(c);
  }
}
function abrirZoom(m){
  const im = zoom.querySelector("img"), vi = zoom.querySelector("video");
  if (m.tipo === "video") { im.style.display = "none"; vi.style.display = "block"; vi.src = m.arquivo; vi.play().catch(() => {}); }
  else { vi.pause(); vi.style.display = "none"; im.style.display = "block"; im.src = m.arquivo; }
  zoom.style.display = "flex";
}
zoom.addEventListener("click", e => { if (e.target.tagName === "VIDEO") return; const vi = zoom.querySelector("video"); vi.pause(); zoom.style.display = "none"; });
document.getElementById("filtros").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filtro = b.dataset.f;
  document.querySelectorAll("#filtros button").forEach(x => x.classList.toggle("on", x === b));
  render();
});
render();
</script>
</body>
</html>
